name: Compile ESP8266 Firmware (Manual)

on:
  workflow_dispatch:
    inputs:
      sketch_folder:
        description: 'Pilih Folder Sketch yang mau di-compile'
        required: true
        default: 'alarm'
        type: choice
        options:
          - alarm
          - serial

# Wajib ada agar GitHub Actions punya izin untuk membuat Release baru
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0

      - name: Install ESP8266 Platform & Libraries
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli lib install "MD_Parola"
          arduino-cli lib install "MD_MAX72XX"

      - name: Compile Selected Sketch
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ./${{ github.event.inputs.sketch_folder }} --output-dir ./build

      - name: Rename and Zip Binary
        run: |
          cd ./build
          mv *.bin ${{ github.event.inputs.sketch_folder }}.bin
          zip ${{ github.event.inputs.sketch_folder }}.zip ${{ github.event.inputs.sketch_folder }}.bin

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Membuat tag otomatis berdasarkan tanggal & jam saat di-run
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          
          # Membuat Release baru dan melampirkan file .zip di GitHub
          gh release create "$TAG" ./build/${{ github.event.inputs.sketch_folder }}.zip \
            --title "Firmware ${{ github.event.inputs.sketch_folder }} ($TAG)" \
            --notes "Auto-compiled firmware untuk folder: ${{ github.event.inputs.sketch_folder }}"
